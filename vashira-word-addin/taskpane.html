<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Vashira Scribe</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d0d12; color: #fff; padding: 20px; }
        .item { background: rgba(255,255,255,0.05); padding: 12px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
        .item:hover { border-color: #6366f1; background: rgba(99,102,241,0.1); }
        .title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
        .meta { font-size: 0.75rem; color: #9ca3af; }
        h2 { color: #6366f1; font-size: 1.2rem; margin-bottom: 20px; }
        #status { font-size: 0.7rem; opacity: 0.5; margin-top: 20px; text-align: center; }
        .toolbar { margin-bottom: 15px; display: flex; gap: 10px; }
        button { background: #6366f1; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        button:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <h2>Mastery Hub</h2>
    <div class="toolbar">
        <button id="refreshBtn">Refresh Library</button>
        <button id="generateBibBtn">Generate Bibliography</button>
    </div>
    <div id="items-list">Loading Mastery Hub...</div>
    <div id="status">Vashira Hub connection active on :51235</div>

    <script>
        Office.onReady((info) => {
            if (info.host === Office.HostType.Word) {
                loadHubItems();
                document.getElementById('refreshBtn').onclick = loadHubItems;
                document.getElementById('generateBibBtn').onclick = generateBibliography;
            }
        });

        async function loadHubItems() {
            try {
                const response = await fetch('http://localhost:51235/items');
                const items = await response.json();
                const list = document.getElementById('items-list');
                list.innerHTML = '';
                
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `
                        <div class="title">\${item.title}</div>
                        <div class="meta">\${item.authors} (\${item.published})</div>
                    `;
                    div.onclick = () => insertCitation(item);
                    list.appendChild(div);
                });
            } catch (e) {
                document.getElementById('items-list').innerText = "Vashira Hub unreachable. Ensure the app is running.";
            }
        }

        function insertCitation(item) {
            const authorPart = item.authors ? item.authors.split(',')[0].trim() : "Unknown";
            const citeText = `(${authorPart}, ${item.published || "n.d."})`;
            Word.run(async (context) => {
                const range = context.document.getSelection();
                const cc = range.insertContentControl();
                cc.title = "Vashira Citation";
                cc.tag = `vashira-cite:${item.id}`;
                cc.insertText(citeText, Word.InsertLocation.replace);
                cc.appearance = Word.ContentControlAppearance.boundingBox;
                await context.sync();
            }).catch(e => console.error("Error inserting citation", e));
        }

        async function generateBibliography() {
            Word.run(async (context) => {
                const controls = context.document.contentControls;
                context.load(controls, 'tag');
                await context.sync();

                const itemIds = [];
                for (let i = 0; i < controls.items.length; i++) {
                    if (controls.items[i].tag.startsWith('vashira-cite:')) {
                        const id = controls.items[i].tag.split(':')[1];
                        if (id) itemIds.push(parseInt(id, 10));
                    }
                }

                if (itemIds.length === 0) return;

                try {
                    const response = await fetch('http://localhost:51235/api/v1/format-bibliography', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ itemIds })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        const docBody = context.document.body;
                        docBody.insertParagraph("References", Word.InsertLocation.end).styleBuiltIn = Word.Style.heading1;
                        docBody.insertText(data.bibliography, Word.InsertLocation.end);
                        await context.sync();
                    }
                } catch (e) {
                    console.error("Error formatting bibliography", e);
                }
            });
        }
    </script>
</body>
</html>
