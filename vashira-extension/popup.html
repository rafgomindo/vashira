<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 340px; padding: 16px; font-family: 'Segoe UI', sans-serif; background: #0d0d12; color: white; margin: 0; }
    .btn { background: #6366f1; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px;}
    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #374151; cursor: not-allowed; }
    h2 { font-size: 1.1rem; margin: 0 0 8px 0; color: #6366f1; display: flex; align-items: center; gap: 8px;}
    p { font-size: 0.8rem; color: #9ca3af; margin: 4px 0;}
    .metadata-box { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; margin-top: 10px;}
    .field-name { font-size: 0.7rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px;}
    .field-value { font-size: 0.9rem; font-weight: 500; margin-bottom: 8px; word-break: break-word;}
  </style>
</head>
<body>
  <h2>Vashira Sentinel</h2>
  <p id="status">Scanning page for research mastery...</p>
  
  <div id="metadata-container" class="metadata-box" style="display:none">
    <div class="field-name">Title</div>
    <div class="field-value" id="disp-title"></div>
    <div class="field-name">Authors</div>
    <div class="field-value" id="disp-authors"></div>
    <div class="field-name">Type</div>
    <select id="item-type" style="width:100%; padding: 4px; margin-bottom: 8px; background: #1f2937; color: white; border: 1px solid #374151; border-radius: 4px;">
      <option value="journalArticle">Journal Article</option>
      <option value="book">Book</option>
      <option value="webpage">Webpage</option>
      <option value="preprint">Preprint</option>
    </select>
  </div>

  <button id="masterBtn" class="btn" style="display:none">VAULT THIS PAGE</button>
  
  <script>
    let currentMetadata = null;

    chrome.tabs.query({ active: true, currentWindow: true }, async (tabs) => {
      chrome.tabs.sendMessage(tabs[0].id, { type: 'GET_METADATA' }, (response) => {
        if (response && (response.title || response.doi)) {
          currentMetadata = response;
          document.getElementById('status').innerText = response.doi ? `DOI Found: ${response.doi}` : `Web Resource Detected`;
          
          document.getElementById('disp-title').innerText = response.title || 'Unknown Title';
          document.getElementById('disp-authors').innerText = response.authors || 'Unknown Authors';
          if (!response.doi) document.getElementById('item-type').value = 'webpage';

          document.getElementById('metadata-container').style.display = 'block';
          document.getElementById('masterBtn').style.display = 'block';

          document.getElementById('masterBtn').onclick = () => {
            currentMetadata.itemType = document.getElementById('item-type').value;
            currentMetadata.title = document.getElementById('disp-title').innerText;
            
            chrome.runtime.sendMessage({ type: 'MASTER_PAGE', data: currentMetadata });
            document.getElementById('status').innerText = "Vashira is archiving this work...";
            document.getElementById('masterBtn').disabled = true;
          };
        } else {
          document.getElementById('status').innerText = "Could not parse page metadata.";
        }
      });
    });
  </script>
</body>
</html>
